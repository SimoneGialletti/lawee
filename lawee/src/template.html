<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Lawee · demo guidata</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" href="{{FAVICON}}">
<style>
{{CSS}}
</style>
</head>
<body>
{{SPRITE}}
<div id="app">
  <div id="stage" data-phone="0" data-dim="0">
    <div id="mswitch"></div>
    <div class="panes">
      <section class="compcol" aria-label="Il computer">
        <div class="who" id="compwho"></div>
        <div id="comp"></div>
      </section>
      <section class="phonecol" aria-label="Il telefono">
        <div class="phonebox" id="phonebox"><div class="dev" id="dev"><div class="scr" id="phone"></div></div></div>
        <div class="who" id="phonewho"></div>
      </section>
    </div>
    <div id="sline" aria-live="polite"></div>
    <div id="card" aria-hidden="true"></div>
  </div>
  <div id="player">
    <div id="segs"></div>
    <div class="pbar">
      <div class="ctl">
        <button type="button" class="pb round" data-ui="prev" aria-label="Passo precedente"></button>
        <button type="button" class="pb play" data-ui="play"></button>
        <button type="button" class="pb next" data-ui="next" aria-label="Avanti"></button>
      </div>
      <button type="button" class="pnow" data-ui="info" aria-label="Rileggi il passo"><span class="num" id="count"></span><b id="gtitle"></b></button>
      <div class="vp" id="vpick" role="group" aria-label="Versione"></div>
    </div>
  </div>
</div>
<div id="cursor" aria-hidden="true"><svg viewBox="0 0 22 22"><path d="M3 2l14 8-6.2 1.6L8 18z"/></svg><span class="rip"></span></div>
<script>
{{JS}}
</script>
</body>
</html>
