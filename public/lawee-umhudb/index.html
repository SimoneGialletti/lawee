/* ─── Tokens: Lawee design system, light theme (tokens/colors.css, typography.css, spacing.css) ─── */
:root {
  --petrolio-50: #EEF4F5; --petrolio-100: #D9E7EA; --petrolio-200: #B3CED4; --petrolio-400: #568C99; --petrolio-600: #275A68; --petrolio-700: #1F4A57; --petrolio-800: #183A45; --petrolio-900: #112A33;
  --carta-0: #FFFFFF; --carta-25: #FCFBF8; --carta-50: #F7F5F0; --carta-100: #EFECE5; --carta-200: #E3DFD5; --carta-300: #CFC9BC; --carta-400: #A9A296; --carta-500: #7A7368; --carta-600: #625C53; --carta-700: #4A453E; --carta-800: #33302B; --carta-900: #22201C; --carta-950: #1B1A17;
  --bg-app: var(--carta-50); --bg-surface: var(--carta-0); --bg-sunken: var(--carta-100); --bg-hover: rgba(27,26,23,.04); --bg-selected: var(--petrolio-50); --bg-overlay: rgba(27,26,23,.42);
  --border-1: var(--carta-200); --border-2: var(--carta-300);
  --text-1: var(--carta-950); --text-2: var(--carta-600); --text-3: var(--carta-500); --text-disabled: var(--carta-400);
  --accent: var(--petrolio-700); --accent-hover: var(--petrolio-800); --accent-soft: var(--petrolio-50); --accent-soft-2: var(--petrolio-100); --accent-text: var(--petrolio-600);
  --focus-ring: 0 0 0 2px var(--bg-surface), 0 0 0 4px var(--petrolio-400);
  --st-urgent-bg: #FBEAE6; --st-urgent-border: #F0C4BA; --st-urgent-fg: #A2321F; --st-urgent-solid: #C23E28;
  --st-due-bg: #FCF1DE; --st-due-border: #EED3A4; --st-due-fg: #8A5A0F; --st-due-solid: #D08A1C;
  --st-verified-bg: #E6F2EA; --st-verified-border: #B9DBC5; --st-verified-fg: #23673F; --st-verified-solid: #2E8550;
  --st-pending-bg: #ECEDF6; --st-pending-border: #C9CCE6; --st-pending-fg: #464C8C; --st-pending-solid: #5A60A8;
  --st-neutral-bg: var(--carta-100); --st-neutral-border: var(--carta-200); --st-neutral-fg: var(--carta-700); --st-neutral-solid: var(--carta-500);
  --ch-email: var(--carta-700); --ch-pec: var(--petrolio-600); --ch-whatsapp: #2C7A55; --ch-phone: #5A60A8;
  --shadow-1: 0 1px 2px rgba(27,26,23,.06);
  --shadow-2: 0 1px 2px rgba(27,26,23,.04), 0 4px 12px -2px rgba(27,26,23,.08);
  --shadow-3: 0 2px 4px rgba(27,26,23,.06), 0 16px 40px -8px rgba(27,26,23,.18);
  --ease: cubic-bezier(.2,0,0,1);
  --f-display: "Clash Display", "Satoshi", system-ui, sans-serif;
  --f-sans: "Satoshi", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-serif: "Source Serif 4", Georgia, serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  /* The stage around the product: ink, with the dark theme's accent (colors.css, [data-theme="dark"]) */
  --ink: var(--carta-950); --ink-2: var(--carta-900); --ink-line: var(--carta-800); --ink-line-2: var(--carta-700);
  --on-ink: #EDEAE3; --on-ink-2: var(--carta-400); --ink-accent: #8FB9C3; --ink-accent-hover: #A6CAD2; --ink-accent-fg: #0B1D24;
  color-scheme: light;
}
/* Chameleon: the eight perimeter tints. A client's tint only identifies that client. */
.h-salvia { --h: #5F8263; --hs: #E9F0E9; } .h-terracotta { --h: #A65B40; --hs: #F6E9E3; } .h-ocra { --h: #9C7428; --hs: #F5EEDF; } .h-ardesia { --h: #55667A; --hs: #E8ECF0; }
.h-prugna { --h: #74506A; --hs: #F0E8EE; } .h-petrolio { --h: #2F6F7E; --hs: #E3EEF0; } .h-oliva { --h: #6C6D3A; --hs: #EEEEE1; } .h-rosa { --h: #A06A6F; --hs: #F5EAEB; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; overflow: hidden; background: var(--ink); color: var(--on-ink); font: 400 14px/1.5 var(--f-sans); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
p { margin: 0; }
.ic { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; vertical-align: middle; }
.ic.solid { fill: currentColor; stroke: none; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--f-mono); font-size: 12px; font-weight: 400; }
.lmark, .mark { display: block; flex: none; color: var(--accent); }
.word { font: 600 20px/1 var(--f-display); letter-spacing: -.015em; color: var(--text-1); }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes fadein { from { opacity: 0; transform: translateY(6px); } }
@keyframes blink { 50% { opacity: 0; } }
.spin { display: inline-block; width: 12px; height: 12px; flex: none; border: 1.5px solid var(--accent); border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }

/* ─── Frame: stage over player ───────────────────────────────────────────── */
#app { position: fixed; inset: 0; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; padding-top: env(safe-area-inset-top, 0px); }
#stage { position: relative; min-height: 0; min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); padding: 12px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); }
#mswitch { grid-row: 1; display: none; }
.panes { grid-row: 2; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px; }
#stage[data-phone="0"] .phonecol { display: none; }
.compcol { min-width: 0; min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 8px; }
.phonecol { min-height: 0; display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 8px; justify-items: center; }
.phonecol .who { max-width: 100%; justify-self: stretch; justify-content: center; }
.who { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 13px; color: var(--on-ink-2); }
.who b { color: var(--on-ink); font-weight: 600; }
.who > span:last-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wav { display: inline-grid; place-items: center; width: 22px; height: 22px; flex: none; border-radius: 50%; background: var(--petrolio-600); color: #fff; font: 600 9.5px/1 var(--f-sans); letter-spacing: .02em; }
.wav.h-terracotta { background: var(--h); }
.phonebox { position: relative; min-height: 0; width: 100%; }
#comp { min-height: 0; min-width: 0; display: grid; }

/* ─── Player ─────────────────────────────────────────────────────────────── */
#player { background: var(--ink-2); border-top: 1px solid var(--ink-line); padding-bottom: env(safe-area-inset-bottom, 0px); }
#segs { display: flex; gap: 3px; height: 4px; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); margin-top: -2px; }
.seg { flex: 1; height: 4px; border: 0; padding: 0; background: var(--ink-line); border-radius: 2px; cursor: pointer; position: relative; overflow: hidden; }
.seg.cut { margin-left: 7px; }
.seg.done { background: var(--ink-accent); }
.seg i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--ink-accent); transition: width .28s linear; }
.pbar { display: flex; align-items: center; gap: 10px; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); min-width: 0; }
.pbar .ctl { display: flex; align-items: center; gap: 8px; flex: none; }
.pb { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 6px; border: 1px solid var(--ink-line-2); background: transparent; color: var(--on-ink); cursor: pointer; white-space: nowrap; font-weight: 600; transition: background .12s var(--ease), border-color .12s var(--ease); }
.pb:hover { border-color: var(--carta-500); }
.pb:disabled { opacity: .4; cursor: default; }
.pb.round { width: 36px; padding: 0; justify-content: center; }
.pb.play { background: var(--ink-accent); color: var(--ink-accent-fg); border-color: var(--ink-accent); }
.pb.play:hover { background: var(--ink-accent-hover); }
.pb:focus-visible, .seg:focus-visible, .vp button:focus-visible, .pnow:focus-visible, .msw button:focus-visible, .vopt:focus-visible { outline: 2px solid var(--ink-accent); outline-offset: 2px; }
.pnow { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; background: none; border: 0; padding: 4px 2px; cursor: pointer; text-align: left; }
.pnow .num { color: var(--on-ink-2); font-size: 12px; flex: none; }
.pnow b { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pnow .ic { color: var(--on-ink-2); }
.vp { display: inline-flex; border: 1px solid var(--ink-line-2); border-radius: 8px; padding: 3px; flex: none; }
.vp button { display: inline-flex; align-items: center; gap: 5px; border: 0; background: none; border-radius: 5px; padding: 6px 12px; cursor: pointer; color: var(--on-ink-2); white-space: nowrap; font-weight: 500; }
.vp button.on { background: var(--ink-line); color: var(--on-ink); font-weight: 600; }
.vp button .ic { width: 14px; height: 14px; }
.vp .vmore { display: none; }

/* ─── Cards over the stage: a Lawee modal (radius 12, overlay ink 42%) ──── */
#card { position: absolute; inset: 0; display: none; place-items: center; padding: 16px; z-index: 30; background: var(--bg-overlay); }
#card.on { display: grid; animation: fadein .18s var(--ease); }
.scard { width: min(560px, 100%); max-height: 100%; overflow: auto; background: var(--bg-surface); color: var(--text-1); border: 1px solid var(--border-1); border-radius: 12px; padding: 22px 26px 20px; box-shadow: var(--shadow-3); display: grid; gap: 10px; position: relative; }
.sc-top { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--text-2); }
.sc-top .mark { width: 24px; height: 24px; }
.sc-top .sc-n { margin-left: auto; font-size: 12px; color: var(--text-3); white-space: nowrap; }

.scard h2 { margin: 0; font: 500 clamp(24px, 4.2vw, 30px)/1.15 var(--f-display); letter-spacing: -.01em; text-wrap: balance; }
.scard p { font-size: 17px; line-height: 1.5; color: var(--text-1); }
.scard .sc-note { font-size: 13px; color: var(--text-2); border-top: 1px solid var(--border-1); padding-top: 12px; }
.sc-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 4px; font-size: 12.5px; color: var(--text-3); }

.scard .pb { color: var(--text-1); border-color: var(--border-2); background: var(--bg-surface); }
.scard .pb:hover { background: var(--bg-sunken); }
.scard .pb.pri { background: var(--accent); border-color: var(--accent); color: #fff; }
.scard .pb.pri:hover { background: var(--accent-hover); }
.scard .pb:focus-visible { outline: 0; box-shadow: var(--focus-ring); }
.sc-time { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; border-radius: 0 0 12px 12px; overflow: hidden; }
.sc-time b { display: block; height: 100%; width: 0; background: var(--accent); animation: fill var(--read, 4000ms) linear forwards; animation-play-state: paused; }
#card.run .sc-time b { animation-play-state: running; }
@keyframes fill { to { width: 100%; } }
.vopts { display: grid; gap: 10px; }
.vopt { display: flex; align-items: center; gap: 14px; text-align: left; padding: 13px 16px; border-radius: 8px; border: 1px solid var(--border-2); background: var(--bg-surface); color: var(--text-1); cursor: pointer; }
.vopt b { display: block; font-size: 16px; font-weight: 600; }
.vopt small { display: block; color: var(--text-2); font-size: 13px; margin-top: 2px; }
.vopt.go { background: var(--accent); border-color: var(--accent); color: #fff; }
.vopt.go small { color: var(--petrolio-100); }
.vopt .ic { width: 18px; height: 18px; }
.vend { justify-content: flex-end; }
.vend .pb { margin-left: 0; }
#sline { position: absolute; left: 16px; right: calc(var(--pw, 0px) + 34px); bottom: 26px; margin-inline: auto; z-index: 25; width: fit-content; max-width: min(640px, calc(100% - 32px - var(--pw, 0px))); display: none; align-items: flex-start; gap: 10px; background: rgba(27,26,23,.96); color: var(--on-ink); border: 1px solid var(--ink-line-2); border-radius: 12px; padding: 10px 16px 10px 12px; font-size: 15px; line-height: 1.4; box-shadow: var(--shadow-3); }
#sline.on { display: flex; animation: fadein .28s var(--ease); }
#sline .mark { width: 20px; height: 20px; margin-top: 1px; color: var(--ink-accent); }

/* cursor */
#cursor { position: fixed; left: 0; top: 0; z-index: 20; pointer-events: none; opacity: 0; transition-property: transform, opacity; transition-timing-function: cubic-bezier(.4,.1,.25,1); transform: translate(-40px, -40px); }
#cursor.on { opacity: 1; }
#cursor svg { width: 22px; height: 22px; display: block; filter: drop-shadow(0 2px 3px rgba(0,0,0,.3)); }
#cursor svg path { fill: var(--carta-950); stroke: #fff; stroke-width: 1.4; }
#cursor .rip { position: absolute; left: -12px; top: -12px; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--petrolio-400); opacity: 0; }
#cursor.tap .rip { animation: rip .45s ease-out; }
@keyframes rip { from { transform: scale(.3); opacity: 1; } to { transform: scale(1.4); opacity: 0; } }

/* ─── Lawee on the computer ─────────────────────────────────────────────── */
.app { position: relative; min-height: 0; min-width: 0; display: grid; grid-template-rows: 56px minmax(0, 1fr); background: var(--bg-app); color: var(--text-1); border-radius: 10px; overflow: hidden; container: app / inline-size; box-shadow: 0 0 0 1px var(--ink-line); --sw: 248px; }

.search { display: inline-flex; align-items: center; gap: 8px; height: 36px; width: 280px; min-width: 0; padding: 0 12px; border: 1px solid var(--border-1); border-radius: 6px; background: var(--bg-app); color: var(--text-3); font-size: 13px; white-space: nowrap; overflow: hidden; }

.nv.more { display: none; }
.msheet { position: absolute; inset: 56px 0 0; z-index: 6; background: var(--bg-overlay); display: grid; align-items: end; justify-items: end; padding: 0 8px 62px; animation: fadein .18s var(--ease); }
.mpanel { width: min(240px, 100%); background: var(--bg-surface); border: 1px solid var(--border-1); border-radius: 12px; box-shadow: var(--shadow-3); padding: 6px; display: grid; gap: 2px; }
.mpanel .nv { display: flex; flex-direction: row; justify-content: flex-start; height: 40px; font-size: 14px; }

.nb { margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--accent); color: #fff; font: 600 11px/20px var(--f-sans); text-align: center; }
.page { position: relative; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 24px 28px 40px; }

.ph { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px 16px; flex-wrap: wrap; }

.st { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 999px; border: 1px solid; white-space: nowrap; font: 600 12px/1 var(--f-sans); flex: none; }
.st .ic { width: 13px; height: 13px; stroke-width: 2; }
.st-urgent { background: var(--st-urgent-bg); border-color: var(--st-urgent-border); color: var(--st-urgent-fg); }
.st-due { background: var(--st-due-bg); border-color: var(--st-due-border); color: var(--st-due-fg); }
.st-verified { background: var(--st-verified-bg); border-color: var(--st-verified-border); color: var(--st-verified-fg); }
.st-pending { background: var(--st-pending-bg); border-color: var(--st-pending-border); color: var(--st-pending-fg); }
.st-neutral { background: var(--st-neutral-bg); border-color: var(--st-neutral-border); color: var(--st-neutral-fg); }
.sdot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

.cchip { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px; border-radius: 3px; background: var(--hs); color: var(--h); font: 600 11px/1 var(--f-sans); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }

.cav { display: inline-grid; place-items: center; width: 36px; height: 36px; flex: none; border-radius: 6px; background: var(--hs); color: var(--h); border: 1px solid color-mix(in srgb, var(--h) 22%, transparent); font: 600 13px/1 var(--f-sans); letter-spacing: .02em; }
.cav.sm { width: 24px; height: 24px; font-size: 9.5px; border-radius: 4px; }
.cav.lg { width: 48px; height: 48px; font-size: 17px; }
.perim { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px 0 8px; border-radius: 999px; background: var(--hs); color: var(--h); border: 1px solid color-mix(in srgb, var(--h) 30%, transparent); font: 600 12px/1 var(--f-sans); white-space: nowrap; }
.perim .ic { width: 12px; height: 12px; stroke-width: 2; }
.srcb { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; height: 26px; padding: 0 8px 0 4px; border-radius: 4px; border: 1px solid var(--border-2); background: var(--bg-surface); color: var(--text-1); font: 500 12px/1 var(--f-sans); vertical-align: middle; white-space: nowrap; }
.srcb .sn, .sidx, .vt .sn { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 3px; background: var(--st-verified-bg); color: var(--st-verified-fg); font: 700 10px/1 var(--f-sans); flex: none; }
.srcb .sl { overflow: hidden; text-overflow: ellipsis; }
.srcb .sd { color: var(--text-3); overflow: hidden; text-overflow: ellipsis; }
.srcb .ic { width: 12px; height: 12px; color: var(--accent-text); }
.sidx { min-width: 16px; height: 16px; font-family: var(--f-sans); vertical-align: 2px; margin: 0 1px; }
.srcs { display: flex; flex-wrap: wrap; gap: 6px; }
/* Lawee speaking, in the first person */
.lnote { display: flex; align-items: flex-start; gap: 10px; padding: 11px 14px; border-radius: 8px; background: var(--accent-soft); border: 1px solid var(--petrolio-100); font-size: 14px; color: var(--text-1); }
.lnote .lmark { width: 18px; height: 18px; margin-top: 1px; }
.lnote b { font-weight: 600; }
.lnote.warn { background: var(--st-urgent-bg); border-color: var(--st-urgent-border); }
.lnote.ok { background: var(--st-verified-bg); border-color: var(--st-verified-border); }
.box { background: var(--bg-surface); border: 1px solid var(--border-1); border-radius: 8px; box-shadow: var(--shadow-1); min-width: 0; overflow: hidden; }
.boxh { display: flex; align-items: baseline; justify-content: space-between; gap: 4px 12px; padding: 12px 16px; border-bottom: 1px solid var(--border-1); flex-wrap: wrap; }
.boxh h2 { margin: 0; font: 700 15px/1.35 var(--f-sans); display: inline-flex; align-items: center; gap: 8px; }
.boxh h2 .ic { color: var(--text-2); }
.boxh .sub { font-size: 12.5px; color: var(--text-3); margin: 0; }
.tabs { display: flex; gap: 20px; border-bottom: 1px solid var(--border-1); overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { display: inline-flex; align-items: center; gap: 6px; height: 40px; margin-bottom: -1px; border-bottom: 2px solid transparent; font-weight: 500; color: var(--text-2); white-space: nowrap; }
.tab.on { color: var(--text-1); font-weight: 600; border-bottom-color: var(--accent); }
.tn { font: 600 11px/1 var(--f-sans); padding: 3px 6px; border-radius: 999px; background: var(--bg-sunken); color: var(--text-2); }
.tab.on .tn { background: var(--accent-soft); color: var(--accent-text); }
.tw { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.t th { text-align: left; font: 600 11px/1.3 var(--f-sans); letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); padding: 9px 14px; border-bottom: 1px solid var(--border-1); background: var(--bg-sunken); white-space: nowrap; }
.t td { height: 36px; padding: 6px 14px; border-bottom: 1px solid var(--border-1); vertical-align: middle; }
.t tr:last-child td { border-bottom: 0; }
.t .r { text-align: right; white-space: nowrap; }
.t .r small { display: block; font-size: 11px; color: var(--text-3); }
.t tr.tot td { font-weight: 700; background: var(--bg-sunken); }
.t tr.go td { background: var(--accent-soft); }
.t .st { height: 22px; font-size: 11.5px; padding: 0 8px; }
.cn2 { display: flex; align-items: center; gap: 10px; }
.cn2 > span:last-child { display: grid; min-width: 0; }
.cn2 b { font-weight: 600; }
.cn2 small { font-size: 12.5px; color: var(--text-2); }
.inp { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border: 1px solid var(--border-2); border-radius: 6px; background: var(--bg-surface); font-size: 14px; color: var(--text-1); min-width: 0; overflow: hidden; }
.inp > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.inp.focus .v::after, .inp.focus .ph::before { content: ""; display: inline-block; width: 1.5px; height: 1.05em; background: var(--text-1); margin-left: 1px; vertical-align: -2px; animation: blink 1s steps(1) infinite; }

.toast { position: absolute; left: 50%; top: 68px; transform: translateX(-50%); z-index: 8; display: flex; align-items: center; gap: 10px; width: max-content; max-width: calc(100% - 32px); background: var(--carta-950); color: var(--carta-25); padding: 11px 16px; border-radius: 8px; font-size: 13.5px; box-shadow: var(--shadow-3); animation: tdown .28s var(--ease); }
.toast .ic { color: #4FAE74; }
@keyframes tdown { from { transform: translate(-50%, -6px); opacity: 0; } }

/* ── Accesso ── */

.ch-email { color: var(--ch-email); } .ch-pec { color: var(--ch-pec); } .ch-whatsapp { color: var(--ch-whatsapp); } .ch-phone { color: var(--ch-phone); }
.mm { min-width: 0; display: grid; gap: 3px; }

/* ── Lawee by Monolite ── */
.bylogo { display: inline-flex; align-items: center; gap: 12px; }

.bar i { display: block; height: 100%; background: var(--accent); }
.box.flow { display: flex; align-items: center; padding: 18px; gap: 0; }
.fnode { flex: 1; min-width: 0; display: grid; justify-items: center; gap: 4px; text-align: center; padding: 12px 10px; border-radius: 8px; border: 1px solid var(--border-1); font-size: 13px; }

.fline { flex: 0 0 32px; height: 1px; background: var(--border-2); position: relative; }
.fline.cut { background: none; border-top: 1px dashed var(--border-2); display: grid; place-items: center; height: 0; }
.fline.cut .ic { width: 14px; height: 14px; background: var(--bg-surface); color: var(--st-urgent-solid); margin-top: -1px; }
.lead.quote { font: 500 22px/1.25 var(--f-display); color: var(--text-1); letter-spacing: -.01em; }

/* ── Closing screens ── */
.slate { display: grid; justify-items: center; align-content: center; gap: 20px; padding: 32px 24px; text-align: center; overflow: auto; background: var(--bg-app); }
.slate .slogo .lmark { width: 64px; height: 64px; }
.slate h1 { margin: 0; font: 500 40px/1.1 var(--f-display); letter-spacing: -.015em; max-width: 20ch; text-wrap: balance; }

.scta { display: grid; justify-items: center; gap: 10px; }

a.btn { text-decoration: none; }
.contacts { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 18px; font-size: 14px; }
.contacts a { display: inline-flex; align-items: center; gap: 6px; color: var(--accent-text); font-weight: 600; text-decoration: none; overflow-wrap: anywhere; }

<script>
// ─── Lawee's screens, drawn from the state, with the Lawee design system ────────
// The computer (Avv. Chiara Ferri in Lawee) and the phone (Luca Rossi in the studio's portale cliente). It reads the
// story's data (window.STORY.data) and the demo's state S; it never changes either.
window.PORTAL = (() => {
"use strict";
const D = () => window.STORY.data;
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const ic = (n, c = "") => `<svg class="ic ${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const T = (t) => ` data-t="${t}"`;
const eur = (n) => "€ " + Number(Math.abs(n)).toLocaleString("it-IT", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const money = (n) => `${n < 0 ? "− " : "+ "}${eur(n)}`;
const mark = (cls = "") => `<svg class="lmark ${cls}" aria-hidden="true"><use href="#lawee-mark"/></svg>`;
const client = (k) => D().clients[k];

// ─── Pieces of the design system ─────────────────────────────────────────────
const ST_ICON = { urgent: "circle-alert", due: "clock", verified: "badge-check", pending: "hourglass", neutral: "archive" };
const st = (k, label, icon) => `<span class="st st-${k}">${icon === false ? "" : ic(icon || ST_ICON[k])}${esc(label)}</span>`;
const dot = (k, label) => `<span class="st st-${k}"><i class="sdot"></i>${esc(label)}</span>`;
// The client chip in the client's perimeter tint.
const cchip = (k, matter) => `<span class="cchip h-${client(k).hue}"><i></i>${esc(client(k).name)}${matter ? `<span>· ${esc(matter)}</span>` : ""}</span>`;
const av = (k, size = "") => `<span class="cav h-${client(k).hue} ${size}">${client(k).name.split(" ").slice(0, 2).map((w) => w[0]).join("")}</span>`;

function mrow(S, m) {

  const chips = tagged
    ? `${cchip(m.c, m.matter)}${m.cat ? `<span class="cat">${esc(m.cat)}</span>` : ""}${m.urgent && !sent ? st("urgent", "Urgente") : ""}${m.att ? `<span class="att">${ic("paperclip")}${m.att}</span>` : ""}${m.draft && !sent ? `<span class="hasd">${ic("file-pen-line")}Bozza pronta</span>` : ""}${sent ? `<span class="hasd ok">${ic("check")}Risposta inviata</span>` : ""}${m.done ? `<span class="hasd mute">${ic("check")}${esc(m.done)}</span>` : ""}`

  return `<div class="mrow${unread ? " unread" : ""}${I.open === m.id ? " sel" : ""}${pec && I.fresh ? " fresh" : ""}"${T(`msg-${m.id}`)}>
    <span class="chi ch-${m.ch}" title="${CH[m.ch][1]}">${ic(CH[m.ch][0])}</span>

function agenda(S) {
  const A = S.agenda;
  const slot = (it) => {
    if (it.k === "prop") {
      if (A.chosen && it.id !== "a") return "";
      const chosen = A.chosen && it.id === "a";
      return chosen
        ? `<div class="slot appointment picked"${T(`slot-${it.id}`)}><i></i><div><small>${ic("users")}${it.t}</small><b>Officine Valtopina</b><span>Luca Rossi, in studio</span></div></div>`
        : `<div class="slot request"${T(`slot-${it.id}`)}><i></i><div><small>${ic("inbox")}${it.t}</small><b>Officine Valtopina</b><span>${A.sent ? "Proposto a Luca Rossi" : "Da proporre"}</span></div></div>`;
    }
    const icn = { appointment: "users", call: "video", deadline: "calendar-clock" }[it.k];
    return `<div class="slot ${it.k}"><i></i><div><small>${ic(icn)}${it.t}</small><b>${esc(it.title)}</b><span>${esc(it.sub)}</span></div></div>`;

  const msg = A.chosen
    ? note("Luca Rossi ha scelto <b>giovedì 22/10 alle 11:00</b>. L'ho messo in agenda e gli ho mandato un promemoria.", "ok")
    : A.sent

  return `${head("Agenda", "Settimana dal 19 al 23 ottobre 2026")}

    <div class="nextw">${ic("building-2")}<span><b>Lun 26/10 · 10:00</b> Udienza Trasimeno Logistica · Tribunale di Perugia</span></div>`;
}

// ─── The demo engine: player, cards, versions, cursor ─────────────────────────
// It plays one story (window.STORY) on one product's screens (window.PORTAL). A story is data: chapters, versions, a
// step list where every step is { v, ch, title, text, line1, view, acts, hold, setup }, and initial() for the state the
// acts change. A version plays the steps of its set (step.v). Jumping to a step replays, at once, the earlier steps of
// the same version, so any step can be opened directly (#full, #law-9).

"use strict";

const ic = (n, c = "") => `<svg class="ic ${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const mark = () => `<svg class="mark" aria-hidden="true"><use href="#lawee-mark"/></svg>`;

// is switched to; `lite` plays the act at once, without the cursor, in the 1-minute version.
const W = (d) => ({ k: "wait", d });
const DO = (d, fn, o = {}) => ({ k: "do", d, fn, ...o });
const CLICK = (d, t, fn, o = {}) => ({ k: "click", d, t, fn, ...o });
const TYPE = (d, t, text, fn, o = {}) => ({ k: "type", d, t, text, fn, ...o });
const LOOK = (d, t, o = {}) => ({ k: "look", d, t, ...o });
const STEPS = ST.steps({ W, DO, CLICK, TYPE, LOOK });

// ─── Versions ───────────────────────────────────────────────────────────────
// Each has its set of steps, its pace (how far it stretches the story's timings), how fast it types and reads (ms a
// word), and its card: a whole one that stops the stage before each step, or a line that goes along with it.
const VERSIONS = Object.fromEntries(ST.versions.map((v) => [v.key, v]));
const VKEYS = ST.versions.map((v) => v.key);
const V = () => VERSIONS[R.v];
let SEQ = [];
const seqOf = (v) => STEPS.map((_, i) => i).filter((i) => STEPS[i].v === VERSIONS[v].set);
const sequence = () => { SEQ = seqOf(R.v); };
const pos = () => SEQ.indexOf(R.step);
const versionOf = (k) => VKEYS.find((v) => seqOf(v).includes(k));
const SEEN_KEY = `${ST.key}-demo-seen`;
function markSeen(v) {
  try {
    const s = new Set(JSON.parse(localStorage.getItem(SEEN_KEY) || "[]"));
    s.add(v);
    localStorage.setItem(SEEN_KEY, JSON.stringify([...s]));
  } catch (e) {}
}

// ─── State ──────────────────────────────────────────────────────────────────
let S = ST.initial();
const R = { v: ST.start, step: 0, i: 0, playing: false, card: false, menu: null, token: 0, mview: "comp", ended: false, read: false };
const C = { left: 0, t0: 0, timer: 0, info: false, resume: false };
const MISSING = (window.__demoMissing = new Set());
// ?fast plays everything ten times faster: for checking every step, not for viewers.
const FAST = /[?&]fast\b/.test(location.search) ? 0.1 : 1;
const sleep = (ms, tok) => new Promise((r) => setTimeout(() => r(tok === undefined || tok === R.token), Math.max(0, ms * FAST)));
const narrow = () => window.innerWidth < 900;
const words = (s) => String(s ?? "").trim().split(/\s+/).filter(Boolean).length;
const firstCard = () => pos() === 0 && !C.info;
const readMs = (k) => Math.max(3000, 1000 + words(`${STEPS[k].title} ${STEPS[k].text}`) * V().wordMs) + (k === SEQ[0] ? Math.round(words(ST.tag) * V().wordMs * 0.6) : 0);
const lineOf = (k) => (V().card === "line" ? STEPS[k][V().line] : "");
const lineMs = (k) => Math.max(2600, 1200 + words(lineOf(k)) * V().wordMs);
const chapter = (k) => { const [, lane, name] = ST.chapters[STEPS[k].ch]; return `${lane} · ${name}`; };
const cardFor = (k) => V().card === "whole" || (V().intro && k === SEQ[0]);

function applyInstant(a) {
  if (a.k === "do" || a.k === "click") a.fn(S);
  else if (a.k === "type") a.fn(S, a.text);
}
// The state at the start of step k (or at its end): the version's earlier steps, played at once.
function stateAt(k, end) {
  const s = ST.initial();
  const prev = S; S = s;
  for (const i of seqOf(versionOf(k))) {
    if (i > k || (i === k && !end)) break;
    STEPS[i].setup?.(S);
    STEPS[i].acts.forEach(applyInstant);
  }
  if (!end) STEPS[k].setup?.(S);
  const out = S; S = prev;
  return out;
}
function clearTransient() {
  S.comp.toast = null; S.focus = null;
  if (S.phone) { if (S.phone.screen !== "lock") S.phone.note = null; }
}

// ─── Render ─────────────────────────────────────────────────────────────────
const CACHE = new Map();
function setHTML(el, html) {
  if (CACHE.get(el) === html) return;
  const keep = {};
  el.querySelectorAll("[data-scroll]").forEach((n) => { keep[n.dataset.scroll] = n.scrollTop; });
  el.innerHTML = html;
  CACHE.set(el, html);
  el.querySelectorAll("[data-scroll]").forEach((n) => { if (keep[n.dataset.scroll] != null) n.scrollTop = keep[n.dataset.scroll]; });
}
function mview() { return S.phone ? R.mview : "comp"; }
// On narrow screens the menu is a row that scrolls sideways: keep the item that matters in view.
function keepInSide(el, smooth) {
  const side = el && el.closest(".side");
  if (!side || side.scrollWidth <= side.clientWidth) return false;
  const l = el.offsetLeft - side.offsetLeft;
  if (l >= side.scrollLeft && l + el.offsetWidth <= side.scrollLeft + side.clientWidth) return false;
  side.scrollTo({ left: Math.max(0, l - 12), behavior: smooth ? "smooth" : "auto" });
  return true;
}
function render() {
  document.body.classList.toggle("narrow", narrow());
  document.body.dataset.mview = mview();
  const stage = $("#stage");
  stage.dataset.phone = S.phone ? "1" : "0";
  stage.dataset.dim = R.card || R.menu ? "1" : "0";
  setHTML($("#compwho"), P.compWho(S));
  setHTML($("#comp"), P.comp(S));
  keepInSide($("#comp .side .nv.on"));
  setHTML($("#phonewho"), S.phone ? P.phoneWho(S) : "");
  setHTML($("#phone"), S.phone ? P.phone(S) : "");
  const mv = mview();
  setHTML($("#mswitch"), `<div class="msw" role="group" aria-label="Schermo"><button type="button" class="${mv === "comp" ? "on" : ""}" data-ui="mview:comp">${ic("monitor")}Computer</button><button type="button" class="${mv === "phone" ? "on" : ""}" data-ui="mview:phone">${ic("smartphone")}Telefono</button></div>`);
  renderPlayer();
  paintCard();
  fitPhone();
}
function fitPhone() {
  const box = $("#phonebox"), dev = $("#dev");
  const stage = $("#stage");
  if (!S.phone || !box.offsetParent) { stage.style.setProperty("--pw", "0px"); return; }
  const h = box.clientHeight, w = box.clientWidth;
  if (narrow()) {
    // Phone width: the viewer's phone shows Luca's screen at close to its own size, without the frame.
    const s = Math.min(1, (w - 4) / 375);
    dev.classList.add("flat");
    dev.style.width = "375px";
    dev.style.height = `${Math.floor(h / s)}px`;
    dev.style.transform = `translateX(-50%) scale(${s})`;
    stage.style.setProperty("--pw", "0px");
    return;
  }
  dev.classList.remove("flat");
  const s = Math.min(0.82, h / 700);
  const height = Math.min(840, h / s);
  dev.style.width = "395px";
  dev.style.height = `${Math.floor(height)}px`;
  dev.style.transform = `translateX(-50%) scale(${s})`;
  $(".phonecol").style.width = `${Math.ceil(395 * s)}px`;
  stage.style.setProperty("--pw", `${Math.ceil(395 * s)}px`);
}

function renderPlayer() {
  const segs = $("#segs");
  const key = `${R.v}:${SEQ.join(",")}`;
  if (segs.dataset.key !== key) {
    segs.dataset.key = key;
    segs.innerHTML = SEQ.map((k, i) => `<button type="button" class="seg${i && STEPS[k].ch !== STEPS[SEQ[i - 1]].ch ? " cut" : ""}" data-ui="seg:${k}" aria-label="Passo ${i + 1}: ${esc(STEPS[k].title)}"><i></i></button>`).join("");
  }
  progress();
  $("#count").textContent = `${pos() + 1}/${SEQ.length}`;
  $("#gtitle").textContent = STEPS[R.step].title;
  const info = $(".pnow");
  if (!info.querySelector(".ic")) info.insertAdjacentHTML("beforeend", ic("info"));
  const fresh = !R.playing && R.i === 0 && pos() === 0 && !R.ended;
  const label = R.ended ? "Ricomincia" : R.playing ? "Pausa" : fresh ? "Guarda la demo" : "Riprendi";
  const play = $('[data-ui="play"]');
  play.innerHTML = `${ic(R.ended ? "rotate-ccw" : R.playing ? "pause" : "play", R.ended ? "" : "solid")}<span class="lb">${label}</span>`;
  play.setAttribute("aria-label", label);
  $('[data-ui="prev"]').innerHTML = ic("arrow-left");
  $('[data-ui="prev"]').disabled = pos() <= 0 && !R.menu;
  $('[data-ui="next"]').innerHTML = `<span class="lb">Avanti</span>${ic("arrow-right")}`;
  $('[data-ui="next"]').disabled = !!R.menu || (!R.card && pos() === SEQ.length - 1);
  setHTML($("#vpick"), VKEYS.map((v) => `<button type="button" class="${v === R.v ? "on" : ""}" data-ui="ver:${v}">${VERSIONS[v].name}${v === R.v ? `<span class="vmore">${ic("chevron-down")}</span>` : ""}</button>`).join(""));
}
function progress() {
  document.querySelectorAll(".seg").forEach((el, i) => {
    const k = SEQ[i];
    const done = k < R.step || (k === R.step && R.ended);
    el.classList.toggle("done", done);
    el.firstElementChild.style.width = k === R.step && !R.ended ? `${Math.round((R.i / Math.max(1, STEPS[k].acts.length)) * 100)}%` : "";
  });
}

// ─── Cards ──────────────────────────────────────────────────────────────────
function stepCard() {
  const k = R.step, first = firstCard();
  return `<div class="scard" role="status">
    <div class="sc-top">${mark()}<span>Demo guidata · ${esc(VERSIONS[R.v].long)}</span><span class="sc-n">Passo ${pos() + 1} di ${SEQ.length}</span></div>
    <div class="sc-ch">${esc(chapter(k))}</div>
    <h2>${esc(STEPS[k].title)}</h2>
    <p>${esc(STEPS[k].text)}</p>
    ${first ? `<p class="sc-note">${esc(ST.tag)}</p>` : ""}
    <div class="sc-foot">${first ? `<span>La demo va avanti da sola: un clic per non aspettare.</span>` : ""}<button type="button" class="pb pri" data-ui="card">Continua${ic("arrow-right")}</button></div>
    <i class="sc-time"><b></b></i></div>`;
}
function pickCard() {
  const opt = (v) => {
    const X = VERSIONS[v];
    return `<button type="button" class="vopt${v === R.v ? " go" : ""}" data-ui="ver:${v}">${ic("play", "solid")}<span><b>${esc(X.long)}</b><small>${esc(X.sub)}</small></span></button>`;
  };
  return `<div class="scard" role="dialog" aria-label="Quale versione?">
    <div class="sc-top">${mark()}<span>Demo guidata · ${esc(ST.title)}</span></div>
    <h2>Quale versione?</h2>
    <div class="vopts">${VKEYS.map(opt).join("")}</div>
    <p class="sc-note">${esc(ST.tag)}</p></div>`;
}
function endCard() {
  const E = ST.ends[R.v];
  return `<div class="scard" role="dialog" aria-label="Fine">
    <div class="sc-top">${mark()}<span>Demo guidata · ${esc(ST.title)}</span></div>
    <h2>${esc(E.title)}</h2>
    <p>${esc(E.text)}</p>
    <p class="sc-note">${esc(ST.tag)}</p>
    <div class="sc-foot vend"><button type="button" class="pb" data-ui="again">${ic("rotate-ccw")}Rivedi</button><button type="button" class="pb pri" data-ui="ver:${E.next}">${esc(E.label)}${ic("arrow-right")}</button></div></div>`;
}
let cardKey = "";
function paintCard() {
  const el = $("#card");
  const key = R.menu ? `menu:${R.menu}:${R.v}` : R.card ? `step:${R.step}:${C.info}:${R.v}` : "";
  if (key !== cardKey) {
    if (key) {
      if (R.card && !R.menu) el.style.setProperty("--read", `${C.left}ms`);
      el.innerHTML = R.menu === "pick" ? pickCard() : R.menu === "end" ? endCard() : stepCard();
    } else el.innerHTML = "";
    cardKey = key;
  }
  el.classList.toggle("on", !!key);
  el.classList.toggle("run", R.card && R.playing && !R.menu && !C.info);
  el.setAttribute("aria-hidden", String(!key));
  const line = $("#sline");
  const text = !R.menu && !R.card ? lineOf(R.step) : "";
  setHTML(line, text ? `${mark()}<span>${esc(text)}</span>` : "");
  line.classList.toggle("on", !!text);
}
function openCard(info = false) {
  R.card = true; C.info = info; C.left = readMs(R.step);
  if (!info) R.read = true;
  cursorHide();
  render();
  if (R.playing && !info) startCardTimer();
}
function startCardTimer() {
  clearTimeout(C.timer);
  C.t0 = performance.now();
  const tok = R.token;
  C.timer = setTimeout(() => { if (tok === R.token && R.card && R.playing) closeCard(true); }, C.left * FAST);
}
function stopCardTimer() { clearTimeout(C.timer); C.left = Math.max(400, C.left - (performance.now() - C.t0)); }
function closeCard(run) {
  clearTimeout(C.timer);
  R.card = false; C.info = false;
  render();
  if (run) { R.playing = true; R.token++; renderPlayer(); runFrom(R.token); }
}

// ─── Cursor ─────────────────────────────────────────────────────────────────
const cursor = $("#cursor");
let cpos = null;
function cursorHide() { cursor.classList.remove("on"); }
const findT = (t) => { const all = [...document.querySelectorAll(`[data-t="${t}"]`)]; return all.find((e) => e.getClientRects().length) || all[0]; };
async function point(t, tok, view) {
  let el = findT(t);
  const pane = view || (el ? (el.closest("#phone") ? "phone" : "comp") : null);
  if (narrow() && S.phone && pane && R.mview !== pane) {
    R.mview = pane; render();
    if (!(await sleep(380, tok))) return null;
  }
  el = findT(t);
  // A target the product keeps behind another control (a menu under «Altro»): open that first.
  const hop = (!el || !el.getClientRects().length) && P.via ? P.via(t, S) : null;
  if (hop && hop.t !== t) {
    if (!(await point(hop.t, tok, view))) return null;
    tap();
    if (!(await sleep(120, tok))) return null;
    hop.open(S); render();
    if (!(await sleep(300, tok))) return null;
    el = findT(t);
  }
  if (!el || !el.getClientRects().length) { MISSING.add(`${R.step + 1}:${t}`); return null; }
  // Bring it into view inside whatever scrolls around it (the page, a list, the sideways menu), and wait for the
  // scroll to settle before the cursor moves.
  for (const axis of ["x", "y"]) {
    const sc = scroller(el, axis);
    if (!sc) continue;
    const er = el.getBoundingClientRect(), sr = sc.getBoundingClientRect();
    if (axis === "y" && (er.top < sr.top + 8 || er.bottom > sr.bottom - 8)) {
      const to = sc.scrollTop + (er.top - sr.top) - Math.max(16, (sr.height - Math.min(er.height, sr.height * 0.8)) * 0.35);
      sc.scrollTo({ top: Math.max(0, to), behavior: "smooth" });
    } else if (axis === "x" && (er.left < sr.left + 8 || er.right > sr.right - 8)) {
      sc.scrollTo({ left: Math.max(0, sc.scrollLeft + (er.left - sr.left) - 12), behavior: "smooth" });
    } else continue;
    await settle(sc);
    if (tok !== R.token) return null;
  }
  const r = el.getBoundingClientRect();
  const x = r.left + (r.width > 180 ? Math.min(40, r.width / 2) : r.width / 2);
  const y = r.top + Math.min(r.height / 2, 24);
  const dist = cpos ? Math.hypot(x - cpos[0], y - cpos[1]) : 300;
  const dur = Math.round(Math.min(900, Math.max(320, dist * 0.9)) * Math.max(0.6, V().pace));
  cursor.style.transitionDuration = cursor.classList.contains("on") ? `${dur * FAST}ms, 200ms` : "0ms, 200ms";
  cursor.style.transform = `translate(${x}px, ${y}px)`;
  cursor.classList.add("on");
  cpos = [x, y];
  if (!(await sleep(dur + 40, tok))) return null;
  return el;
}
function scroller(el, axis) {
  for (let n = el.parentElement; n && n !== document.body; n = n.parentElement) {
    const cs = getComputedStyle(n);
    const o = axis === "x" ? cs.overflowX : cs.overflowY;
    if ((o === "auto" || o === "scroll") && (axis === "x" ? n.scrollWidth > n.clientWidth + 1 : n.scrollHeight > n.clientHeight + 1)) return n;
  }
  return null;
}
// Resolves once a smooth scroll has stopped (three still frames), or after 900 ms at most.
function settle(n) {
  return new Promise((res) => {
    let last = null, still = 0;
    const t0 = performance.now();
    const tick = () => {
      const v = `${n.scrollTop}:${n.scrollLeft}`;
      if (v === last) still++; else { still = 0; last = v; }
      if (still >= 3 || performance.now() - t0 > 900) res(); else requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });
}
function tap() { cursor.classList.remove("tap"); void cursor.offsetWidth; cursor.classList.add("tap"); }

// ─── Playing ────────────────────────────────────────────────────────────────
async function act(a, tok) {
  if (a.lite && V().card === "line") {
    applyInstant(a);
    if (a.view && narrow()) R.mview = a.view;
    render();
    return sleep(60, tok);
  }
  if (!(await sleep(a.d * V().pace, tok))) return false;
  if (a.view && narrow() && S.phone && (a.k === "do" || a.k === "wait")) R.mview = a.view;
  switch (a.k) {
    case "wait": return true;
    case "do":
      a.fn(S);
      if (a.view && narrow()) R.mview = a.view;
      render();
      return sleep(60, tok);
    case "look": {
      await point(a.t, tok, a.view);
      if (tok !== R.token) return false;
      return sleep(200 * V().pace, tok);
    }
    case "click": {
      await point(a.t, tok, a.view);
      if (tok !== R.token) return false;
      tap();
      if (!(await sleep(120, tok))) return false;
      a.fn(S);
      render();
      return sleep(160, tok);
    }
    case "type": {
      await point(a.t, tok, a.view);
      if (tok !== R.token) return false;
      tap();
      S.focus = a.t;
      for (let n = 1; n <= a.text.length; n++) {
        a.fn(S, a.text.slice(0, n));
        render();
        if (!(await sleep(V().typeMs, tok))) return false;
      }
      S.focus = null;
      render();
      return sleep(120, tok);
    }
  }
  return true;
}
async function runFrom(tok) {
  const k = R.step, step = STEPS[k];
  const t0 = performance.now();
  if (narrow() && R.i === 0) { R.mview = step.view || "comp"; render(); }
  // In a short version the line comes first: a moment to read it before anything moves (unless its card was just read).
  if (V().card === "line" && R.i === 0 && !R.read && !(await sleep(lineMs(k), tok))) return;
  while (R.i < step.acts.length) {
    if (!(await act(step.acts[R.i], tok))) return;
    R.i++;
    progress();
  }
  const min = V().card === "line" && !R.read ? lineMs(k) - (performance.now() - t0) : 0;
  if (!(await sleep(Math.max(step.hold * V().pace + (V().rest || 0), min), tok))) return;
  advance(tok);
}
function advance(tok) {
  if (tok !== R.token) return;
  const p = pos();
  if (p >= SEQ.length - 1) {
    R.playing = false; R.ended = true; R.token++;
    markSeen(R.v);
    cursorHide();
    R.menu = "end";
    render();
    return;
  }
  goto(SEQ[p + 1], true);
}
function goto(k, play) {
  R.token++;
  clearTimeout(C.timer);
  S = stateAt(k, false);
  clearTransient();
  R.step = k; R.i = 0; R.ended = false; R.card = false; R.read = false; C.info = false;
  R.mview = STEPS[k].view || "comp";
  R.playing = !!play;
  cursorHide(); cpos = null;
  CACHE.clear();
  if (cardFor(k)) openCard(false);
  else { render(); if (play) runFrom(R.token); }
}
function choose(v) {
  R.v = v; R.menu = null;
  sequence();
  goto(SEQ[0], true);
}
function play() {
  if (R.menu === "pick") return choose(R.v);
  if (R.menu === "end" || R.ended) { R.menu = null; return goto(SEQ[0], true); }
  R.playing = true;
  if (R.card) {
    if (C.info) { closeCard(true); return; }
    render(); startCardTimer(); return;
  }
  R.token++; render(); runFrom(R.token);
}
function pause() {
  R.playing = false; R.token++;
  if (R.card) stopCardTimer();
  S.focus = null;
  render();
}
function next() {
  if (R.menu) return;
  if (R.card && !C.info) { closeCard(true); return; }
  if (R.card && C.info) { closeCard(false); }
  const p = pos();
  if (p < SEQ.length - 1) goto(SEQ[p + 1], R.playing);
}
function prev() {
  if (R.menu === "end") { R.menu = null; }
  const p = pos();
  if (p > 0) goto(SEQ[p - 1], R.playing);
}
function showInfo() {
  if (R.menu) return;
  if (R.card) { if (C.info) closeCard(false); else closeCard(true); return; }
  const was = R.playing;
  if (was) pause();
  C.resume = was;
  openCard(true);
}
function cardButton() {
  if (C.info) { const was = C.resume; closeCard(false); if (was) play(); } else closeCard(true);
}

// ─── Input ──────────────────────────────────────────────────────────────────
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-ui]");
  const ui = b?.dataset.ui;
  if (!ui) {
    // A click on the card itself sends it away, as its button does.
    if (e.target.closest("#card .scard") && R.card) cardButton();
    return;
  }
  if (ui === "play") return R.playing ? pause() : play();
  if (ui === "prev") return prev();
  if (ui === "next") return next();
  if (ui === "info") return showInfo();
  if (ui === "again") { R.menu = null; return goto(SEQ[0], true); }
  if (ui === "card") return cardButton();
  if (ui.startsWith("ver:")) {
    const v = ui.slice(4);
    if (narrow() && !R.menu && v === R.v) { if (R.playing) pause(); R.menu = "pick"; return render(); }
    return choose(v);
  }
  if (ui.startsWith("seg:")) { R.menu = null; return goto(Number(ui.slice(4)), R.playing); }
  if (ui.startsWith("mview:")) { R.mview = ui.slice(6); return render(); }
});
document.addEventListener("keydown", (e) => {
  if (e.target.closest("button") && (e.key === " " || e.key === "Enter")) return;
  if (e.key === " ") { e.preventDefault(); R.playing ? pause() : play(); }
  else if (e.key === "ArrowRight") next();
  else if (e.key === "ArrowLeft") prev();
});
let rz = 0;
window.addEventListener("resize", () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(() => { CACHE.clear(); render(); }); });
document.addEventListener("visibilitychange", () => { if (document.hidden && R.playing) pause(); });

// ─── Start ──────────────────────────────────────────────────────────────────
// The minute starts on its own, on its first card. #full opens the complete version at its first step; #law-9 opens
// step 9. Both wait for a click to play.
function start() {
  const h = location.hash.slice(1);
  const m = h.match(new RegExp(`^${ST.key}-(\\d+)$`));
  const whole = VKEYS.find((v) => VERSIONS[v].card === "whole");
  if (h === "full" || m) {
    const k = m ? Math.min(Math.max(1, Number(m[1])), STEPS.length) - 1 : seqOf(whole)[0];
    R.v = versionOf(k); sequence();
    goto(k, false);
    return;
  }
  R.v = ST.start; sequence();
  goto(SEQ[0], !document.hidden);
}
// For checks: show step k as it starts, or as it ends (`end`), with no card over it.
function show(k, end) {
  R.token++; R.playing = false; R.menu = null; R.card = false; clearTimeout(C.timer);
  R.v = versionOf(k); sequence();
  S = stateAt(k, !!end);
  R.step = k; R.i = end ? STEPS[k].acts.length : 0;
  R.mview = STEPS[k].view || "comp";
  CACHE.clear(); cursorHide(); render();
}
window.__demo = { R, get S() { return S; }, STEPS, goto, play, pause, choose, show, render, VERSIONS, get SEQ() { return SEQ; }, readMs, lineMs, markSeen };
start();
})();

</script>
</body>
</html>
